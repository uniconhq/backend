name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UNICON_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      UNICON_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/forge
          path: forge

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.13
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy
      - run: uv run pytest

      - name: Migrate an empty database
        run: uv run unicon migrate

      - name: openapi.json is current
        run: |
          uv run unicon openapi
          git diff --exit-code openapi.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/forge
          path: forge
      - run: docker build --tag unicon-backend:${{ github.sha }} -f backend/Dockerfile .

  publish:
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: uniconhq/forge
          path: forge

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit for the immutable tag
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/uniconhq/backend:main
            ghcr.io/uniconhq/backend:sha-${{ steps.commit.outputs.short }}
