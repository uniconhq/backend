[project]
name = "unicon-backend"
version = "0.1.0"
description = "The Unicon HTTP shell: routes, cookies and the OpenAPI document over the forge package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "unicon-forge==0.14.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
]

[project.scripts]
unicon = "unicon.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "import-linter>=2.15",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
]

[tool.uv.sources]
unicon-forge = { url = "https://github.com/uniconhq/forge/releases/download/v0.14.0/unicon_forge-0.14.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unicon"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["unicon", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -p forge.testing"

[tool.importlinter]
root_packages = ["unicon", "tests", "forge"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the backend and its tests reach forge only through forge.api, and never the database"
type = "forbidden"
source_modules = ["unicon", "tests"]
forbidden_modules = [
    "forge.services",
    "forge.runtime",
    "forge.settings",
    "forge.log",
    "forge.cli",
    "forge.domain",
    "forge.port",
    "forge.db",
    "forge.forges",
    "sqlalchemy",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the running app never loads the test kit"
type = "forbidden"
source_modules = ["unicon"]
forbidden_modules = ["forge.testing"]
