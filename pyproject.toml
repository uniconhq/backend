[project]
name = "unicon-backend"
version = "0.1.0"
description = "The Unicon HTTP shell: routes, cookies and the OpenAPI document over the forge package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "unicon-forge==0.1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "itsdangerous>=2.2.0",
    "pydantic>=2.13.5",
]

[project.scripts]
unicon = "unicon.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "import-linter>=2.15",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
]

[tool.uv.sources]
unicon-forge = { path = "../forge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unicon"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["unicon", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -p forge.testing"

[tool.importlinter]
root_packages = ["unicon", "forge"]

[[tool.importlinter.contracts]]
name = "the backend never reaches a table in the forge package"
type = "forbidden"
source_modules = ["unicon"]
forbidden_modules = ["forge.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the backend never reaches a forge implementation"
type = "forbidden"
source_modules = ["unicon"]
forbidden_modules = ["forge.forges"]
allow_indirect_imports = true
